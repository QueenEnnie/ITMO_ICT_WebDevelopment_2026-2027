{{define "content"}}
    <section class="panel auth solo">
        <p class="eyebrow auth-heading">С ВОЗВРАЩЕНИЕМ</p>
        <h2 class="auth-heading">Вход в класс</h2>
        <form method="post" action="/login">
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            <label>
                Логин
                <input name="username" value="{{index .Form "username"}}" autocomplete="username" required>
            </label>
            <label>
                Пароль
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="primary wide">Войти</button>
        </form>
        <p class="authlink">
            Первый раз здесь?
            <a href="/register">Создать аккаунт</a>
        </p>
    </section>
{{end}}
